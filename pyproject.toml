[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdradar"
version = "0.1.0"
description = "Micro-Doppler radar activity classification: signal processing, baselines, robustness and calibration studies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adebanji Adelowo" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
data = ["py7zr>=0.22"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
demo = ["streamlit>=1.33"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27", "nbformat>=5", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]
