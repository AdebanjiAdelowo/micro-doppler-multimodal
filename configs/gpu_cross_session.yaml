# Full leave-one-session-out with more seeds. NOT run locally.
experiment: cross_session
split_seed: 0
seeds: [0, 1, 2, 3, 4]
n_boot: 2000
models: [svm, random_forest, light_cnn, resnet_small, temporal_cnn, transformer]
spec: {n_window: 200, hop: 40, n_fft: 256, window: hann, fd_max_hz: 250.0, dynamic_range_db: 45.0}
train: {epochs: 80, batch_size: 64, lr: 0.002, weight_decay: 0.01, patience: 20}
splits:
  unseen_sites_6_7: [6, 7]
  unseen_session_1: [1]
  unseen_session_2: [2]
  unseen_session_3: [3]
  unseen_session_4: [4]
  unseen_session_5: [5]
  unseen_session_6: [6]
  unseen_session_7: [7]
