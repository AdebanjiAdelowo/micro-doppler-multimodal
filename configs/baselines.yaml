# RQ1, RQ5: feature-model and architecture comparison, calibration.
experiment: baselines
n_splits: 5
split_seed: 0
seeds: [0, 1, 2]
n_boot: 1000
reference: light_cnn
models: [svm, random_forest, light_cnn, resnet_small, temporal_cnn, transformer]
spec: {n_window: 200, hop: 40, n_fft: 256, window: hann, fd_max_hz: 250.0, dynamic_range_db: 45.0}
train: {epochs: 40, batch_size: 64, lr: 0.002, weight_decay: 0.01, patience: 10}
